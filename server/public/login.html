<!DOCTYPE html>
<html lang="vi">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Đăng nhập Quản trị | Góc Mặc Đẹp</title>
	<style>
		:root {
			--accent: #e11d48;
			--accent-hover: #be123c;
			--bg: #f8fafc;
			--card-bg: #ffffff;
			--text: #0f172a;
			--text-muted: #64748b;
			--border: #e2e8f0;
		}
		* { box-sizing: border-box; margin: 0; padding: 0; }
		body {
			font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
			background-color: var(--bg);
			color: var(--text);
			display: flex;
			align-items: center;
			justify-content: center;
			min-height: 100vh;
			padding: 1.5rem;
		}
		.login-card {
			background: var(--card-bg);
			width: 100%;
			max-width: 420px;
			padding: 2.5rem 2rem;
			border-radius: 16px;
			box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.03);
			border: 1px solid var(--border);
		}
		.login-header {
			text-align: center;
			margin-bottom: 2rem;
		}
		.login-header h1 {
			font-size: 1.7rem;
			color: var(--accent);
			margin-bottom: 0.4rem;
			font-weight: 800;
		}
		.login-header p {
			color: var(--text-muted);
			font-size: 0.95rem;
		}
		.form-group {
			margin-bottom: 1.3rem;
		}
		.form-group label {
			display: block;
			font-size: 0.9rem;
			font-weight: 600;
			margin-bottom: 0.4rem;
			color: #334155;
		}
		.form-group input {
			width: 100%;
			padding: 0.75rem 1rem;
			border: 1px solid var(--border);
			border-radius: 8px;
			font-size: 1rem;
			outline: none;
			transition: border-color 0.2s, box-shadow 0.2s;
		}
		.form-group input:focus {
			border-color: var(--accent);
			box-shadow: 0 0 0 3px rgba(225, 29, 72, 0.15);
		}
		.btn-submit {
			width: 100%;
			padding: 0.85rem;
			background: var(--accent);
			color: #ffffff;
			border: none;
			border-radius: 8px;
			font-size: 1rem;
			font-weight: 600;
			cursor: pointer;
			transition: background 0.2s;
			margin-top: 0.5rem;
		}
		.btn-submit:hover {
			background: var(--accent-hover);
		}
		.alert {
			padding: 0.75rem 1rem;
			border-radius: 8px;
			font-size: 0.9rem;
			margin-bottom: 1.2rem;
			display: none;
		}
		.alert-error {
			background-color: #fee2e2;
			color: #b91c1c;
			border: 1px solid #fecaca;
		}
		.otp-group {
			display: none;
			background: #fff1f2;
			padding: 1rem;
			border-radius: 8px;
			border: 1px dashed var(--accent);
		}
	</style>
</head>
<body>
	<div class="login-card">
		<div class="login-header">
			<h1>Góc Mặc Đẹp</h1>
			<p>Hệ thống Quản trị Blog</p>
		</div>

		<div id="alertBox" class="alert alert-error"></div>

		<form id="loginForm">
			<div class="form-group">
				<label for="username">Tên đăng nhập</label>
				<input type="text" id="username" required autocomplete="username" autofocus>
			</div>

			<div class="form-group">
				<label for="password">Mật khẩu</label>
				<input type="password" id="password" required autocomplete="current-password">
			</div>

			<div class="form-group otp-group" id="otpGroup">
				<label for="otp">Mã xác thực 2 lớp (OTP 6 số)</label>
				<input type="text" id="otp" placeholder="123456" maxlength="6" inputmode="numeric">
				<small style="display:block; margin-top: 0.3rem; color: #881337;">Mở Google Authenticator trên điện thoại để lấy mã</small>
			</div>

			<button type="submit" class="btn-submit" id="submitBtn">Đăng nhập</button>
		</form>
	</div>

	<script>
		const form = document.getElementById('loginForm');
		const alertBox = document.getElementById('alertBox');
		const otpGroup = document.getElementById('otpGroup');
		const submitBtn = document.getElementById('submitBtn');

		function showAlert(msg) {
			alertBox.innerText = msg;
			alertBox.style.display = 'block';
		}

		form.addEventListener('submit', async (e) => {
			e.preventDefault();
			alertBox.style.display = 'none';
			submitBtn.disabled = true;
			submitBtn.innerText = 'Đang xử lý...';

			const username = document.getElementById('username').value.trim();
			const password = document.getElementById('password').value;
			const otp = document.getElementById('otp').value.trim();

			try {
				const res = await fetch('/admin/login', {
					method: 'POST',
					headers: { 'Content-Type': 'application/json' },
					body: JSON.stringify({ username, password, otp }),
				});
				const data = await res.json();

				if (res.ok && data.success) {
					window.location.href = data.redirect || '/admin';
				} else {
					showAlert(data.error || 'Đăng nhập không thành công.');
					if (data.require2FA) {
						otpGroup.style.display = 'block';
						document.getElementById('otp').focus();
					}
				}
			} catch (err) {
				showAlert('Lỗi kết nối máy chủ. Vui lòng thử lại.');
			} finally {
				submitBtn.disabled = false;
				submitBtn.innerText = 'Đăng nhập';
			}
		});
	</script>
</body>
</html>
